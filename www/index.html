<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16223B">
<title>Tiếng Nhật N5–N3</title>
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#16223B;--mut:#66708A;--acc:#2447A8;--line:#DCE1EC;--good:#1F8A5B;--bad:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans JP","Hiragino Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;font-weight:600;flex:1}
header button{background:none;border:0;color:#fff;font-size:22px;padding:2px 8px}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.lvl{margin:0 0 18px}
.lvl h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;font:inherit;color:inherit;text-align:left}
.row b{font-weight:600}.row small{color:var(--mut)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);border-radius:8px;font:inherit;color:var(--mut)}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:10px;background:#fff}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:7px}
.item .w{font-size:20px;font-family:"Noto Serif JP","Hiragino Mincho ProN",serif}
.item .r{color:var(--acc);font-size:14px;margin-left:8px}
.item .m{color:var(--ink)}.item .t{color:var(--mut);font-size:13px}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.d{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14.5px;color:#2c3857}
.d p{margin:4px 0}.d .f{color:var(--acc);font-weight:600}
.k{display:flex;gap:14px}.k .big{font-size:44px;line-height:1.1;font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;min-width:56px}
.more{display:block;margin:10px auto;padding:10px 20px;border:1px solid var(--acc);background:none;color:var(--acc);border-radius:8px;font:inherit}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:300px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.fc .big{font-size:46px;font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;line-height:1.25;word-break:break-all}
.fc .hint{color:var(--mut);font-size:14px}.fc .rd{color:var(--acc);font-size:20px}.fc .mn{font-size:20px}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:0 2px 8px}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;padding:14px;border:0;border-radius:10px;font:inherit;font-weight:600;color:#fff}
.no{background:var(--bad)}.yes{background:var(--good)}.pri{background:var(--acc)}
.q{font-size:30px;text-align:center;font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;margin:14px 0 18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font:inherit;color:inherit}
.opt.ok{border-color:var(--good);background:#E6F5EE}.opt.ng{border-color:var(--bad);background:#FBE9E7}
.center{text-align:center;padding:30px 0}.center h2{margin:0 0 6px}
.empty{color:var(--mut);text-align:center;padding:26px}
</style>
</head>

const LEVELS=[["N5","Sơ cấp",["n5v","n5g"]],["N4","Sơ cấp",["n4v","n4g"]],["N3","Trung cấp",["n3v","n3g","n3k"]]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const known=id=>{try{return new Set(JSON.parse(localStorage.getItem("k:"+id)||"[]"))}catch(e){return new Set()}};
const saveKnown=(id,s)=>{try{localStorage.setItem("k:"+id,JSON.stringify([...s]))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hasM=(k,it)=>k==="kanji"?!!it.v:!!it.m;
const S={limit:60,q:"",card:null,quiz:null};

function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/");
  const id=p[1],tab=p[2]||"list";
  const app=$("#app"),back=$("#back");
  back.hidden=!id;
  if(!id){$("#title").textContent="Tiếng Nhật N5–N3";return home(app)}
  const D=DATA[id];$("#title").textContent=D.t;
  S.limit=60;S.q="";
  if(tab==="cards"&&D.k!=="grammar")return startCards(app,id);
  if(tab==="quiz"&&D.k!=="grammar")return startQuiz(app,id);
  list(app,id);
}
$("#back").onclick=()=>history.back();
addEventListener("hashchange",route);

function home(app){
  app.innerHTML=LEVELS.map(([n,sub,ids])=>`<section class="lvl"><h2>${n} · ${sub}</h2>`+ids.map(id=>{
    const D=DATA[id],kn=known(id).size,tot=D.i.filter(x=>hasM(D.k,x)).length;
    const bar=D.k==="grammar"?"":`<div class="bar"><i style="width:${tot?kn*100/tot:0}%"></i></div>`;
    return `<button class="row" onclick="location.hash='#/d/${id}'"><span style="flex:1"><b>${D.t}</b><br><small>${D.i.length} mục${D.k==="grammar"?"":" · đã nhớ "+kn}</small>${bar}</span><span>›</span></button>`}).join("")+`</section>`).join("");
}

function tabs(id,cur){
  const D=DATA[id];if(D.k==="grammar")return"";
  const T=[["list","Danh sách"],["cards","Thẻ nhớ"],["quiz","Trắc nghiệm"]];
  return `<div class="tabs">${T.map(([k,l])=>`<button class="${k===cur?"on":""}" onclick="location.replace('#/d/${id}/${k}')">${l}</button>`).join("")}</div>`;
}

function itemHTML(k,it){
  if(k==="vocab")return `<div class="item"><span class="w">${esc(it.w)}</span><span class="r">${esc(it.r)}</span><div class="m">${esc(it.m)||"<i class='t'>(chưa có nghĩa)</i>"}</div>${it.t?`<div class="t">${esc(it.t)}</div>`:""}</div>`;
  if(k==="kanji")return `<div class="item k"><div class="big">${esc(it.k)}</div><div><b>${esc(it.v)}</b> <span class="t">On: ${esc(it.on)||"–"} · Kun: ${esc(it.kun)||"–"}</span>${it.ex.map((e,i)=>`<div class="d" style="margin-top:4px;padding-top:4px"><span>${esc(e)}</span> <span class="t">${esc(it.m[i]||"")}</span></div>`).join("")}</div></div>`;
  const det=(it.d||[]).map(x=>`<p>${x.f?`<span class="f">${esc(x.f)}</span><br>`:""}${esc(x.t)}</p>`).join("")+(it.n?`<p>${esc(it.n)}</p>`:"");
  return `<details class="item"><summary><b>${esc(it.g)}</b><div class="m">${esc(it.m)}</div></summary>${det?`<div class="d">${det}</div>`:""}</details>`;
}

function list(app,id){
  const D=DATA[id];
  app.innerHTML=tabs(id,"list")+`<input type="search" id="q" placeholder="Tìm kiếm (Nhật hoặc Việt)…"><div id="L"></div>`;
  const q=$("#q");q.oninput=()=>{S.q=q.value;S.limit=60;paint()};
  function paint(){
    const s=S.q.trim().toLowerCase();
    const f=s?D.i.filter(it=>JSON.stringify(it).toLowerCase().includes(s)):D.i;
    $("#L").innerHTML=f.slice(0,S.limit).map(it=>itemHTML(D.k,it)).join("")||`<div class="empty">Không tìm thấy kết quả.</div>`;
    if(f.length>S.limit){const b=document.createElement("button");b.className="more";b.textContent=`Xem thêm (${f.length-S.limit})`;b.onclick=()=>{S.limit+=100;paint()};$("#L").appendChild(b)}
  }
  paint();
}

function front(k,it){return k==="kanji"?it.k:it.w}
function startCards(app,id){
  const D=DATA[id],kn=known(id);
  const q=shuffle(D.i.map((it,i)=>i).filter(i=>hasM(D.k,D.i[i])&&!kn.has(i)));
  S.card={q,flip:false,done:0};cards(app,id);
}
function cards(app,id){
  const D=DATA[id],c=S.card,kn=known(id),tot=D.i.filter(x=>hasM(D.k,x)).length;
  if(!c.q.length){app.innerHTML=tabs(id,"cards")+`<div class="center"><h2>Hoàn thành 🎉</h2><p class="t">Bạn đã nhớ ${kn.size}/${tot} thẻ.</p><button class="more" id="rs">Học lại từ đầu</button></div>`;
    $("#rs").onclick=()=>{saveKnown(id,new Set());startCards(app,id)};return}
  const it=D.i[c.q[0]];
  const back=D.k==="kanji"?`<div class="rd">${esc(it.v)}</div><div class="hint">On: ${esc(it.on)||"–"} · Kun: ${esc(it.kun)||"–"}</div><div class="mn">${it.ex.map(esc).join("<br>")}</div><div class="hint">${it.m.map(esc).join(" · ")}</div>`
    :`${it.r?`<div class="rd">${esc(it.r)}</div>`:""}<div class="mn">${esc(it.m)}</div>${it.t?`<div class="hint">${esc(it.t)}</div>`:""}`;
  app.innerHTML=tabs(id,"cards")+`<div class="meta"><span>Còn ${c.q.length} thẻ</span><span>Đã nhớ ${kn.size}/${tot}</span></div>
  <div class="fc" id="fc"><div class="big">${esc(front(D.k,it))}</div>${c.flip?back:`<div class="hint">Chạm để xem nghĩa</div>`}</div>
  ${c.flip?`<div class="btns"><button class="no" id="no">Chưa nhớ</button><button class="yes" id="yes">Đã nhớ</button></div>`:`<div class="btns"><button class="pri" id="show">Hiện đáp án</button></div>`}`;
  const flip=()=>{c.flip=true;cards(app,id)};
  $("#fc").onclick=()=>{if(!c.flip)flip()};
  if(c.flip){
    $("#no").onclick=()=>{c.q.push(c.q.shift());c.flip=false;cards(app,id)};
    $("#yes").onclick=()=>{const i=c.q.shift();kn.add(i);saveKnown(id,kn);c.flip=false;cards(app,id)};
  }else $("#show").onclick=flip;
}

function startQuiz(app,id){
  const D=DATA[id],pool=D.i.filter(x=>hasM(D.k,x));
  const ans=x=>D.k==="kanji"?x.v:x.m;
  const qs=shuffle(pool).slice(0,10).map(it=>{
    const wrong=[];for(const o of shuffle(pool)){if(ans(o)!==ans(it)&&!wrong.includes(ans(o)))wrong.push(ans(o));if(wrong.length===3)break}
    return{p:front(D.k,it),a:ans(it),o:shuffle([ans(it),...wrong])};
  });
  S.quiz={qs,i:0,s:0,pick:null};quiz(app,id);
}
function quiz(app,id){
  const z=S.quiz;
  if(z.i>=z.qs.length){app.innerHTML=tabs(id,"quiz")+`<div class="center"><h2>${z.s}/${z.qs.length} câu đúng</h2><button class="more" id="again">Làm bộ mới</button></div>`;$("#again").onclick=()=>startQuiz(app,id);return}
  const q=z.qs[z.i];
  app.innerHTML=tabs(id,"quiz")+`<div class="meta"><span>Câu ${z.i+1}/${z.qs.length}</span><span>Điểm ${z.s}</span></div><div class="q">${esc(q.p)}</div>`+
   q.o.map((o,i)=>{let c="";if(z.pick!==null){if(o===q.a)c=" ok";else if(i===z.pick)c=" ng"}return `<button class="opt${c}" data-i="${i}">${esc(o)}</button>`}).join("")+
   (z.pick!==null?`<div class="btns"><button class="pri" id="nx">Tiếp</button></div>`:"");
  if(z.pick===null)document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{z.pick=+b.dataset.i;if(q.o[z.pick]===q.a)z.s++;quiz(app,id)});
  else $("#nx").onclick=()=>{z.i++;z.pick=null;quiz(app,id)};
}
route();
</script>
</body>
</html>
